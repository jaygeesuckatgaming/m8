# m8's config. Paths are relative to this file. Each model is a server m8 calls:
# point the URLs at your own. This copy uses the Gem system's local services:
# Laya decides, Ollama talks and sees, StyleTTS2 speaks, Whisper hears.

[mate]
name = "Gem"
# The persona: its prompts and level stories (examples/kevin holds Gem's prompts).
persona = "examples/kevin"
# The voice: our StyleTTS2 adapter speaks Breeze TTS 2's API (start_m8_styletts2).
voice_server = "http://127.0.0.1:8091"
voice_reference = "voices/soldier.wav"
voice_seed = 42

[mic]
# Pick the microphone by name (case-insensitive); unset uses Windows' default.
device = "Microphone (Yeti Stereo Microphone)"
barge_in = true
mute_while_speaking = true
vad_threshold = 0.5
end_of_speech_silence = 0.1
save_recordings = false

[stt]
# Speech to text: the Gem system's Whisper server, OpenAI-style.
url = "http://127.0.0.1:13310/v1/audio/transcriptions"
model = "whisper-1"

[kev]
# The decision model: Laya serves llama.cpp's /v1/systemone shape.
url = "http://127.0.0.1:5002/v1/systemone"

[llm]
# The LLM and eyes: Ollama, OpenAI-style.
url = "http://127.0.0.1:11434/v1/chat/completions"
model = "gemma3-4b-ctx:latest"
vision_model = "gemma3:4b-it-qat"
temperature = 1.0

[models]
# Silero VAD, which runs in m8: it finds where speech starts and ends in the mic's audio.
silero_vad = "models/silero_vad.onnx"

[game]
port = 47800
